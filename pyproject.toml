[build-system]
requires = ['hatchling', 'hatch-fancy-pypi-readme>=22.5.0']
build-backend = 'hatchling.build'

[project]
name = "adaptive_filter"
version = "0.2.0"
description = "Python implementation of DSP adaptive filters"
readme = "README.md"
authors = [
    { name = "bglid", email = "benjamin.h.glidden@gmail.com" }
]
license="MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "scikit-learn==1.6.1",
    "librosa==0.11.0",
    "soundfile==0.14.0",
]
classifiers = [  
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/bglid/ANC-adaptive-filters"
Repository = "https://github.com/bglid/ANC-adaptive-filters"


[dependency-groups]
dev = [
    "isort[colors]>=5.10.1,<6.0.0",
    "bandit>=1.7.1,<2.0.0",
    "black>=26.3.1",
    "darglint>=1.8.1,<2.0.0",
    "mypy>=1.14.0",
    "mypy-extensions>=1.0.0,<2.0.0",
    "pre-commit>=4.0.1,<5.0.0",
    "pydocstyle>=6.1.1,<7.0.0",
    "pylint>=3.3.7,<4.0.0",
    "pytest>=9.1.1",
    "pyupgrade>=3.19.1,<4.0.0",
    "safety>=2.2.0",
    "coverage>=7.6.9,<8.0.0",
    "coverage-badge>=1.1.0,<2.0.0",
    "pytest-html>=3.1.1,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]




[tool.black]
# https://github.com/psf/black
target-version = ["py310"]
line-length = 88
color = true

exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | env
    | venv
)/
'''

[tool.isort]
# https://github.com/timothycrosley/isort/
py_version = 310
line_length = 88

known_typing = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]
sections = ["FUTURE", "TYPING", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
include_trailing_comma = true
profile = "black"
multi_line_output = 3
indent = 4
color_output = true

[tool.mypy]
# https://mypy.readthedocs.io/en/latest/config_file.html#using-a-pyproject-toml-file
python_version = "3.10"
pretty = true
show_traceback = true
color_output = true

allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true


[tool.pytest.ini_options]
# https://docs.pytest.org/en/6.2.x/customize.html#pyproject-toml
# Directories that are not visited by pytest collector:
norecursedirs =["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
doctest_optionflags = ["NUMBER", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]

# Extra options:
addopts = [
  "--strict-markers",
  "--tb=short",
  "--doctest-modules",
  "--doctest-continue-on-failure",
]

[tool.coverage.run]
source = ["adaptive_filter"]
branch = true

[tool.coverage.paths]
source = ["adaptive_filter"]

[tool.coverage.report]
fail_under = 50
show_missing = true
