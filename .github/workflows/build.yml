name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run style checks
        run: |
          uv run isort --diff --check-only --settings-path pyproject.toml .
          uv run black --diff --check --config pyproject.toml .
          uv run darglint --verbosity 2 adaptive_filter tests

      # - name: Run type checks
      #   run: uv run mypy --config-file pyproject.toml .

      - name: Run tests
        run: |
          uv run pytest \
            --cov-report=term-missing \
            --cov=adaptive_filter \
            tests/

      - name: Run safety checks
        run: |
          uv run safety check --full-report --policy-file=safety-policy.yml
          uv run bandit -ll --recursive adaptive_filter tests

      - name: Build package
        run: uv build
