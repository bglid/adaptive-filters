default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.5.0
    hooks:
      - id: check-yaml

  # Python
  - repo: local
    hooks:
      - id: pyupgrade
        name: pyupgrade
        entry: uv run pyupgrade --py310-plus
        types: [python]
        language: system

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort --settings-path pyproject.toml
        types: [python]
        language: system

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black --config pyproject.toml
        types: [python]
        language: system

  # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c "cd rust && cargo fmt --all"
        types: [rust]
        language: system
        files: ^rust/
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: bash -c "cd rust && cargo check"
        types: [rust]
        language: system
        files: ^rust/
        pass_filenames: false
      
      - id: clippy
        name: clippy 
        entry: bash -c "cd rust && cargo clippy --all-targets --all-features -- -Dwarnings"
        types: [rust]
        language: system
        files: ^rust/
        pass_filenames: false
